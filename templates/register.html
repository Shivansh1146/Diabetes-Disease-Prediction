<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Register – Diabetes Prediction System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
</head>
<body>
<div class="auth-page">
  <div class="auth-card fade-in-up">
    <div class="auth-logo">
      <div class="logo-icon">🏥</div>
      <h2>Create Account</h2>
      <p>Join the Diabetes Prediction System</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="flash-alert alert alert-{{ cat }}"><i class="fas fa-circle-info me-2"></i>{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST" action="{{ url_for('register') }}" novalidate>
      <div class="form-group">
        <label class="form-label" for="username"><i class="fas fa-user me-2"></i>Username</label>
        <input id="username" name="username" type="text" class="form-control-custom"
               placeholder="Choose a username (min 3 chars)" required/>
      </div>
      <div class="form-group">
        <label class="form-label" for="email"><i class="fas fa-envelope me-2"></i>Email</label>
        <input id="email" name="email" type="email" class="form-control-custom"
               placeholder="Enter your email address" required/>
      </div>
      <div class="form-group">
        <label class="form-label" for="password"><i class="fas fa-lock me-2"></i>Password</label>
        <input id="password" name="password" type="password" class="form-control-custom"
               placeholder="Min 6 characters" required/>
      </div>
      <div class="form-group">
        <label class="form-label" for="confirm_password"><i class="fas fa-shield-alt me-2"></i>Confirm Password</label>
        <input id="confirm_password" name="confirm_password" type="password" class="form-control-custom"
               placeholder="Re-enter your password" required/>
      </div>
      <button type="submit" class="btn-primary-custom" style="margin-top:8px">
        <i class="fas fa-user-plus"></i> Create Account
      </button>
    </form>

    <p style="text-align:center;margin-top:20px;font-size:13px;color:var(--text-secondary)">
      Already have an account?
      <a href="{{ url_for('login') }}" style="color:var(--primary-light);font-weight:600;text-decoration:none"> Sign In</a>
    </p>
  </div>
</div>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
