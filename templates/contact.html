<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Contact – Diabetes Prediction System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
</head>
<body>
<div class="app-wrapper">
  {% include '_sidebar.html' %}
  <div class="main-content">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:14px">
        <div class="hamburger" onclick="toggleSidebar()"><span></span><span></span><span></span></div>
        <div class="topbar-title">✉️ Contact Us</div>
      </div>
      <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
    </div>
    <div class="page-content">
      <div class="row g-4">
        <div class="col-md-5 fade-in-up">
          <div class="card-glass" style="height:100%">
            <h4 style="font-weight:700;margin-bottom:20px">Get in Touch</h4>
            <p style="color:var(--text-secondary);margin-bottom:30px">Have questions about the prediction model or want to provide feedback? We'd love to hear from you.</p>
            
            <div style="display:flex;align-items:center;gap:16px;margin-bottom:20px">
              <div style="width:40px;height:40px;border-radius:10px;background:rgba(79,70,229,0.1);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:18px"><i class="fas fa-envelope"></i></div>
              <div><div style="font-size:12px;color:var(--text-secondary)">Email</div><div style="font-weight:600">support@diabetesprediction.ai</div></div>
            </div>
            <div style="display:flex;align-items:center;gap:16px;margin-bottom:20px">
              <div style="width:40px;height:40px;border-radius:10px;background:rgba(16,185,129,0.1);color:var(--success);display:flex;align-items:center;justify-content:center;font-size:18px"><i class="fas fa-phone"></i></div>
              <div><div style="font-size:12px;color:var(--text-secondary)">Phone</div><div style="font-weight:600">+1 (555) 123-4567</div></div>
            </div>
            <div style="display:flex;align-items:center;gap:16px">
              <div style="width:40px;height:40px;border-radius:10px;background:rgba(245,158,11,0.1);color:var(--warning);display:flex;align-items:center;justify-content:center;font-size:18px"><i class="fas fa-map-marker-alt"></i></div>
              <div><div style="font-size:12px;color:var(--text-secondary)">Location</div><div style="font-weight:600">San Francisco, CA</div></div>
            </div>
          </div>
        </div>
        <div class="col-md-7 fade-in-up delay-1">
          <div class="card-glass">
            <h5 style="font-weight:700;margin-bottom:20px">Send a Message</h5>
            <form onsubmit="event.preventDefault(); alert('Message sent successfully!'); this.reset();">
              <div class="row g-3">
                <div class="col-md-6">
                  <div class="form-group"><label class="form-label">Your Name</label><input type="text" class="form-control-custom" required></div>
                </div>
                <div class="col-md-6">
                  <div class="form-group"><label class="form-label">Email Address</label><input type="email" class="form-control-custom" required></div>
                </div>
                <div class="col-12">
                  <div class="form-group"><label class="form-label">Subject</label><input type="text" class="form-control-custom" required></div>
                </div>
                <div class="col-12">
                  <div class="form-group"><label class="form-label">Message</label><textarea class="form-control-custom" rows="4" required></textarea></div>
                </div>
                <div class="col-12">
                  <button type="submit" class="btn-primary-custom" style="width:auto;padding:12px 30px">Send Message <i class="fas fa-paper-plane ms-2"></i></button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
