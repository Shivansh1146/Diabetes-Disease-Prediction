<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Error {{ code }} – Diabetes Prediction System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center">
  <div class="card-glass fade-in-up" style="max-width:500px;padding:50px 30px">
    <div style="font-size:80px;color:var(--primary);margin-bottom:20px;font-weight:800;line-height:1">{{ code }}</div>
    <h3 style="font-weight:700;margin-bottom:10px">Oops! Something went wrong.</h3>
    <p style="color:var(--text-secondary);margin-bottom:30px">{{ msg }}</p>
    <a href="{{ url_for('dashboard') }}" class="btn-primary-custom" style="display:inline-block;width:auto">
      <i class="fas fa-home me-2"></i> Return Home
    </a>
  </div>
</body>
</html>
